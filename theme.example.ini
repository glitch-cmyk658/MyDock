; MyDock 主题示例 —— 复制到 %APPDATA%\MyDock\theme.ini 后改值即生效
; （Dock 的 120ms 轮询会自动发现文件变化，不用重启）
;
; 格式：[light] / [dark] 分节，key=AARRGGBB（透明度+RGB，十六进制，可带 #）
; 没写的 key 落回内建默认；坏值/未知 key 静默忽略。
; 内建默认值与本文件示例一致（2026-10-12 前的界面原样）。

[light]
; macOS 系统蓝：磁贴/菜单高亮/启动台强调
accentBlue=FF007AFF
; 主文字
textPrimary=FF1D1D1F
; 次文字（星期行/副标题）
textSecondary=FF86868B
; 弱文字（相邻月日期/快捷键提示）
textTertiary=96C7C7CC
; 卡片/磁贴底
surfaceCard=FFFFFFFF
; 菜单板底（不透明）
surfacePanel=FFF6F6F8
; 半透明面板 tint（控制中心/日历底）
panelTint=F2F2F2F6
; 半透明面板描边
panelRim=1A000000
; 分隔线
separator=18000000
; 红：周末日期/低电量/日历今天圆
danger=FFFF3B30
; 滑条槽
trackBg=FFE2E2E6
; 滑条已填充段
sliderFill=FF5A5A60
; 磁贴上的图标
iconOnTile=FF46464E
; Dock 标签气泡底/字
labelBg=F0FFFFFF
labelFg=FF1C1C22
; Dock 玻璃 tint
dockGlass=68FCFCFF
; 运行中指示点
dockRunDot=FF4684E8
; 日历面板 tint
calendarTint=F6FCFCFE
; 启动台占位字
launchTextDim=760A0A0E

[dark]
accentBlue=FF0A84FF
textPrimary=FFF2F2F7
textSecondary=FF8E8E93
textTertiary=96636366
surfaceCard=FF2C2C2E
surfacePanel=FF1C1C1E
panelTint=E618181B
panelRim=28FFFFFF
separator=FF48484A
danger=FFFF453A
trackBg=FF5A5A5E
sliderFill=FFF2F2F7
iconOnTile=FFDCDCE2
labelBg=F02D2D34
labelFg=FFF0F0F6
dockGlass=681C1C22
dockRunDot=FF4684E8
calendarTint=E81C1C1E
launchTextDim=760A0A0E
